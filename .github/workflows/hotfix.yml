name: Hotfix publish

# An image out of the door in minutes, for the day something is broken in
# production and the fix is one line.
#
# CI is the pipeline that decides whether a release is any good: two database
# engines, both images verified against a real server, and a browser suite that
# drives the interface. It takes about forty-five minutes, and sixteen of those
# pass before an image is published at all - which is the right shape for a
# release and the wrong shape for an outage.
#
# So this is the other door, and it is deliberately narrower:
#
#   - it is started by hand, on a ref somebody names, and publishes under a tag
#     somebody names. Nothing triggers it, so nothing can publish by accident.
#   - it runs the tests against one engine rather than two, and leaves the
#     browser suite out. Skipping every test is offered and is not the default:
#     a hotfix is exactly when the thing that changed under pressure has been
#     looked at least.
#   - it never moves `latest`. What `latest` points at is decided by main, and
#     an image built in a hurry should not become what a fresh installation
#     gets by default.
#
# The tag it publishes still gets the full CI afterwards, in its own time. This
# is about not waiting for it.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or commit to build.
        required: true
        default: main
      tag:
        description: What to publish it as, without the leading v - 0.9.8.2.
        required: true
      engine:
        description: Which database the tests run against.
        required: true
        default: postgres
        type: choice
        options: [postgres, sqlite]
      skip_tests:
        description: Publish without running any tests. For an outage, not for convenience.
        required: true
        default: false
        type: boolean

env:
  IMAGE_NAME: orknux-server
  IMAGE_NAME_ONE: orknux-one

jobs:
  build:
    name: Build${{ inputs.skip_tests && ' (tests skipped)' || format(' and test ({0})', inputs.engine) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # The interface is a submodule and the all-in-one image builds it, so
          # a checkout without it publishes an image with no interface in it.
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # `verify` where tests are wanted, `package -DskipTests` where they are
      # not: the difference is one flag, and saying it here rather than in two
      # jobs keeps the thing being published identical either way.
      - name: Build
        run: >
          ./mvnw -B -ntp
          ${{ inputs.skip_tests && 'package -DskipTests' || format('verify -Dorknux.test.database={0}', inputs.engine) }}

      - name: Publish test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && !inputs.skip_tests }}
        with:
          name: hotfix-test-results
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore

  publish:
    name: Publish images as ${{ inputs.tag }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The tag somebody asked for, and the commit, which is the tag that never
      # moves. Not `latest`, and not the X.Y line: both of those say "this is
      # what the product is now", which is a claim the full pipeline makes and
      # this one does not.
      - name: Build and push the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.one
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME_ONE }}:${{ inputs.tag }}
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME_ONE }}:sha-${{ github.sha }}
          # A cache scope of its own, as CI does: this image builds a node
          # bundle the other one does not, and one scope would have each build
          # evicting the other's layers.
          cache-from: type=gha,scope=one
          cache-to: type=gha,mode=max,scope=one

      - name: Say what was published
        run: |
          {
            echo "### Published \`${{ inputs.tag }}\`"
            echo
            echo "From \`${{ inputs.ref }}\` at \`${{ github.sha }}\`."
            echo
            echo "- \`${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}\`"
            echo "- \`${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME_ONE }}:${{ inputs.tag }}\`"
            echo
            if [ "${{ inputs.skip_tests }}" = "true" ]; then
              echo "> Published without running tests."
            else
              echo "Tested against ${{ inputs.engine }}; the browser suite was not run."
            fi
            echo
            echo "\`latest\` and the \`X.Y\` line were not moved - those follow the full pipeline."
          } >> "$GITHUB_STEP_SUMMARY"
