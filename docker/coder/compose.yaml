# A coder box, standing beside an Orknux installation rather than inside it.
#
#   docker compose -f docker/coder/compose.yaml up -d --build
#
# Then add it under Admin -> Shell with the private key whose public half you
# handed it below.
name: orknux-coder

services:
  coder:
    build:
      context: .
    image: orknux-jvm-coder:local
    restart: unless-stopped

    ports:
      # Not 22 on the host: that is the machine's own sshd, and the failure -
      # your key works, but you are on the wrong box - takes a while to see.
      - "2222:22"

    environment:
      # Whose key gets in. There is no default and no password, so a start with
      # neither this nor the mount below fails and says what to do about it.
      ORKNUX_AUTHORIZED_KEYS: "${ORKNUX_AUTHORIZED_KEYS:-}"

    volumes:
      # The host keys. Orknux pins the fingerprint it first saw and refuses a
      # different one afterwards, so losing this volume means every existing
      # Shell pointed here stops working until somebody clears the check - and
      # clearing it is the one thing that check exists to prevent.
      - host-keys:/etc/ssh/keys
      # Where work goes. Named rather than bound to a host path by default: a
      # bind mount is right when a task should see a checkout you already have,
      # and wrong when it should not be able to touch it.
      - work:/work
      # The alternative to the environment variable, when a key in a file suits
      # better than a key in a shell's history:
      # - ./orknux.pub:/run/secrets/authorized_keys:ro

    # A build eats what it is given. Left generous but bounded, so a runaway
    # test suite is the container's problem rather than the machine's.
    deploy:
      resources:
        limits:
          memory: 6g

    healthcheck:
      # That the port answers and the answer is an ssh server, which is as far
      # as a health check can honestly go without a key of its own.
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/22' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  host-keys:
  work:
