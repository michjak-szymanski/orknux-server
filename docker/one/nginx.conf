# nginx as an unprivileged process, inside an image that is mostly a JVM.
#
# The packaged configuration on Debian and Ubuntu assumes root: it writes its pid
# to /run, its temporary bodies to /var/lib/nginx and its logs to files under
# /var/log/nginx, none of which a system user may create. So this replaces it
# outright rather than patching it, and every path nginx writes to is somewhere
# the `orknux` user owns.
#
# The server block itself is *not* here. It is the interface image's own
# `default.conf.template`, copied in unchanged and rendered at startup, so there
# is one description of what /api, /graphql and /mcp mean rather than two that
# can disagree.

worker_processes 1;
pid /tmp/orknux-nginx/nginx.pid;

# The container's own streams. A log written to a file inside a container is a
# log nobody reads: `docker logs` is where an operator looks, and it shows what
# was written to stdout and stderr.
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Everything nginx buffers to disk, moved somewhere writable.
    client_body_temp_path /tmp/orknux-nginx/body;
    proxy_temp_path       /tmp/orknux-nginx/proxy;
    fastcgi_temp_path     /tmp/orknux-nginx/fastcgi;
    uwsgi_temp_path       /tmp/orknux-nginx/uwsgi;
    scgi_temp_path        /tmp/orknux-nginx/scgi;

    # An attachment may be 25MB and the server accepts a 26MB request; nginx's
    # own default is 1MB, so without this the upload fails at the proxy with a
    # 413 the server never sees and the limit on the settings screen is a lie.
    client_max_body_size 30m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/conf.d/*.conf;
}
