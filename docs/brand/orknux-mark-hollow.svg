<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Orknux">
  <!--
    Hollow nut. The small-size cut: below 24px the triad's nodes merge into a
    blob, so the mark sheds its interior detail and keeps the silhouette.
    The void is a knockout, so this reads on any ground.
  -->
  <defs>
    <linearGradient id="orknuxMossHollow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#668A6B"/>
      <stop offset="100%" stop-color="#4A6B52"/>
    </linearGradient>
    <mask id="orknuxVoidHollow">
      <rect width="200" height="200" fill="#fff"/>
      <circle cx="100" cy="109" r="50" fill="#000"/>
    </mask>
  </defs>

  <path d="M42 29 L67 50 L133 50 L158 29 L154 64 L181 113 L151 167 L49 167 L19 113 L46 64 Z"
        fill="url(#orknuxMossHollow)" mask="url(#orknuxVoidHollow)"/>
</svg>
