<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 200 200">

<defs>
  <linearGradient id="moss" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#668A6B"/>
    <stop offset="100%" stop-color="#4A6B52"/>
  </linearGradient>
</defs>

<style>
  #nodes {
    transform-box: fill-box;
    transform-origin: center;
    animation: nodePulse 2.4s ease-in-out infinite;
  }
  #edges {
    animation: edgePulse 2.4s ease-in-out infinite;
  }
  @keyframes nodePulse {
    0%,100% { transform: scale(.92); opacity:.86; }
    50% { transform: scale(1.08); opacity:1; }
  }
  @keyframes edgePulse {
    0%,100% { opacity:.58; }
    50% { opacity:1; }
  }
  @media (prefers-reduced-motion: reduce) {
    #nodes, #edges { animation:none; }
  }
</style>

<path d="M42 29 L67 50 L133 50 L158 29 L154 64 L181 113 L151 167 L49 167 L19 113 L46 64 Z"
      fill="url(#moss)"/>
<circle cx="100" cy="109" r="47" fill="#0D1518"/>

<path id="edges" d="M81 125 L112 129 L121 96 Z"
      fill="none" stroke="#5F8467" stroke-width="8" stroke-linejoin="round"/>

<g id="nodes" fill="#5F8467">
  <circle cx="81" cy="125" r="11"/>
  <circle cx="112" cy="129" r="11"/>
  <circle cx="121" cy="96" r="11"/>
</g>
</svg>