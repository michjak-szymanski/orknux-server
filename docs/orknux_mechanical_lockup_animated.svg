<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">

<defs>
  <linearGradient id="moss" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#668A6B"/>
    <stop offset="100%" stop-color="#4A6B52"/>
  </linearGradient>
</defs>

<style>
  #mark {
    transform-box:fill-box;
    transform-origin:center;
    animation: settle 3.8s cubic-bezier(.16,1,.3,1) infinite;
  }
  #word {
    animation: wordIn 3.8s ease-in-out infinite;
  }
  #tag {
    animation: tagIn 3.8s ease-in-out infinite;
  }
  @keyframes settle {
    0% { transform:rotate(-28deg) scale(.92); opacity:.75; }
    22% { transform:rotate(-8deg) scale(1.02); opacity:1; }
    38%,78% { transform:rotate(0deg) scale(1); opacity:1; }
    100% { transform:rotate(-28deg) scale(.92); opacity:.75; }
  }
  @keyframes wordIn {
    0%,13% { transform:translateX(38px); opacity:0; }
    35%,80% { transform:translateX(0); opacity:1; }
    100% { transform:translateX(38px); opacity:0; }
  }
  @keyframes tagIn {
    0%,26% { opacity:0; letter-spacing:18px; }
    44%,80% { opacity:1; letter-spacing:10px; }
    100% { opacity:0; letter-spacing:18px; }
  }

  /* The lockup rotates; that is the kind of motion that makes some people ill. */
  @media (prefers-reduced-motion: reduce) {
    #mark, #word, #tag { animation:none; }
    #tag { letter-spacing:10px; }
  }
</style>

<rect width="1200" height="420" rx="0" fill="#0D1518"/>

<!-- Placement lives on the outer group: a CSS transform animation replaces the
     transform attribute outright, so the two cannot share an element. -->
<g transform="translate(70 55) scale(1.55)">
  <g id="mark">
    <path d="M42 29 L67 50 L133 50 L158 29 L154 64 L181 113 L151 167 L49 167 L19 113 L46 64 Z"
          fill="url(#moss)"/>
    <circle cx="100" cy="109" r="47" fill="#0D1518"/>
    <path d="M81 125 L112 129 L121 96 Z" fill="none" stroke="#5F8467" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="81" cy="125" r="11" fill="#5F8467"/>
    <circle cx="112" cy="129" r="11" fill="#5F8467"/>
    <circle cx="121" cy="96" r="11" fill="#5F8467"/>
  </g>
</g>

<g id="word">
  <text x="410" y="225"
        font-family="Noto Sans, DejaVu Sans, Arial, sans-serif"
        font-size="150" font-weight="850" letter-spacing="-8"
        fill="#F2F1EC">orknux</text>
</g>

<text id="tag" x="418" y="282"
      font-family="Noto Sans, DejaVu Sans, Arial, sans-serif"
      font-size="23" font-weight="650"
      fill="#6F9877">ORCHESTRATION KERNEL</text>
</svg>